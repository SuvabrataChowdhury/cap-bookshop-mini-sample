---
spring:
  jmx:
    enabled: true
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
cds:
  errors:
    prefer-service-exception: true
  odata-v4:
    endpoint.path: "/api"
server.servlet.encoding:
  charset: UTF-8
  force: true
management:
  endpoint:
    health:
      show-components: always
      show-details: always
      probes.enabled: true
  endpoints:
    web:
      exposure:
        include: "health"
  health:
    defaults.enabled: false
    ping.enabled: true
    db.enabled: true

---
spring:
  config.activate.on-profile: default
  datasource:
    url: "jdbc:h2:mem:bookshop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql.init.platform: h2
  sql.init.schema-locations: classpath:schema-h2.sql,classpath:indices-h2.sql
cds:
  data-source:
    auto-config.enabled: false
